[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-factory"
version = "1.0.0"
description = "Multi-Agent Software Factory combining gstack roles, Superpowers TDD, and host compiler verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Huppy AI & Liang Sili" }
]
keywords = [
    "multi-agent",
    "software-factory",
    "gstack",
    "superpowers",
    "claude-code",
    "codex",
    "hermes-agent",
    "tdd",
    "app-development"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
app-factory = "app_factory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app_factory*"]
